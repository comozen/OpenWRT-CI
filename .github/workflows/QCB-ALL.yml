#CI项目
name: QCB-ALL

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      DEVICE:
        description: '机型（同平台不同机型的镜像不可互刷）'
        required: false
        type: choice
        default: xiaomi_be10000
        options:
          - xiaomi_be10000
          - xiaomi_be10000-es
          - xiaomi_be7000
          - xiaomi_be7000-es
          - askey_sbe1v1k
          - nokia_beacon-10
      IP:
        description: 'LAN 地址'
        required: false
        type: string
        default: 10.0.0.99
      HOSTNAME:
        description: '主机名'
        required: false
        type: string
        default: OWRT
      SSID_2G:
        description: 'WiFi 名称 2.4G'
        required: false
        type: string
        default: OWRT
      SSID_5_2G:
        description: 'WiFi 名称 5.2G（留空=同 2.4G）'
        required: false
        type: string
        default: OWRT
      SSID_5_8G:
        description: 'WiFi 名称 5.8G（留空=同 2.4G）'
        required: false
        type: string
        default: OWRT
      WIFI_PASSWORD:
        description: 'WiFi 密码（至少 8 位）'
        required: false
        type: string
        default: '12345678'
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    #同一时间只允许一个 QCB 编译，避免并发抢缓存/重复发 Release
    concurrency:
      group: qcb-${{github.ref}}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ95XX]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [owrt]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: vantage
      #机型（留空或非手动触发时用 Config/IPQ95XX.txt 里的默认机型）
      WRT_DEVICE: ${{inputs.DEVICE || 'xiaomi_be10000'}}
      #默认主机名
      WRT_NAME: ${{inputs.HOSTNAME || 'OWRT'}}
      #默认WIFI名称（2.4G / 5G / 6G 分频段）
      WRT_SSID: ${{inputs.SSID_2G || 'OWRT'}}
      WRT_SSID_5_2G: ${{inputs.SSID_5_2G || inputs.SSID_2G || 'OWRT'}}
      WRT_SSID_5_8G: ${{inputs.SSID_5_8G || inputs.SSID_2G || 'OWRT'}}
      #默认WIFI密码
      WRT_WORD: ${{inputs.WIFI_PASSWORD || '12345678'}}
      #默认地址
      WRT_IP: ${{inputs.IP || '10.0.0.99'}}
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST || false}}
